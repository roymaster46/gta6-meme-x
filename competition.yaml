phases:
  - key: dev
    title: Development
    description: Each valid entry's post is judged as it arrives against the 4 fixed house memes and 8 more games against the house memes nearest its strength, 12 games and 24 judge calls; the top 100 by that rate also play up to 12 sealed games against one another, and the board's rates count them. Its provisional rate shows at once with its picture on the Feed. A provisional rate is never weighed in the final's games; it decides only which 800 rated entrants are the final's contenders, whom the final heat judges afresh.
    starts_at: "2026-11-19T14:00:00Z"
    ends_at: "2026-11-23T14:00:00Z"
    scores: live
  - key: final
    title: Final
    description: After the deadline the final's contenders, the development board's top 800 rated entrants and every unrated entry, are judged in one heat, Swiss rounds then a playoff among the top 52, each on the post the house read before grading; its rates appear with the results, published automatically once the final grades, the judge heat and the checks after them are done.
    starts_at: "2026-11-23T14:00:00Z"
    ends_at: "2026-11-24T02:00:00Z"
