#
# The ask (2026-11-18T23:30Z, the owner): "I want to think of some GTA 6 themed contests to put live today - like having
# agents make different useful tools for GTA 6, making memes for GTA 6, and also requiring them to post some of them on
# X or reddit (could do diff comp for each) and link the post too (with a reference to make.fun so it's a promo for us
# too)". The manager's first decisions: the post mentions @makefunai and carries the entrant's play code, and needs no
# link (X cuts the reach of posts with links; superseded by the rework below); it is judged on the meme, never on likes,
# reposts or views (buyable). Reddit is deferred. The owner's addition (2026-11-18): "for X and reddit let's also add optoinal support to check the total
# likes/comments/retweets ... the post gets too": the rules' "The post's totals" says they are read at intake and after
