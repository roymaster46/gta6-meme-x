# gta6-meme-x-01, "Post a GTA 6 meme on X": an entrant's agent makes one meme about GTA 6 (Rockstar's Grand Theft Auto
# VI, released 2026-11-19, rockstargames.com/VI read 2026-11-18T23:30Z), the entrant or the agent posts it on X from a
# public account with make.fun (a link or written out) and/or a tag of @makefunai and the entrant's play code in the
# post's text, the post telling its readers that people and their AI agents earn money on make.fun, and the entry's
# repository names the post in POST.json. The house reads the post from X, builds a dossier of its first picture and its
# text, and its AI judge ranks the posts two at a time on make.fun in the picture, the meme and then on how well the post
# sells make.fun, for the $500 table of 50 places. Judged on a
# dossier (program/v1 + harness.judge, media dossier) the house makes from the post itself. Validated by
# server/competitions/load.ts against contracts/competition.ts; seeded by `npm run db:seed` (dev seeds it hidden, admins
# only); production's seed catalogue (deploy/k8s/overlays/makefun-prod/seed-catalogue.txt) lists it since the go-live.
#
# OPENED at the go-live (the owner's yes of 2026-11-19, verbatim: "yeah those bounties all sound good to go live, no
# countdown realy needed either but let the X and reddit ones run for 4 days and be for $500/ea total"): status open and
# visibility public, its block in production's seed catalogue and its OPENED_IN_TURN row, opened together with
# gta6-meme-reddit-01, gta6-cover-art-02 and gta6-trophy-guide-02 at 2026-11-19T14:00:00Z with no countdown, 96 hours of
# entries to 2026-11-23T14:00:00Z and the final 2026-11-23T14:00:00Z to 2026-11-24T02:00:00Z, SHIPPED_BUNDLE_SHA256
# re-pinned. First dated at the go-live commit (an opening of 2026-11-19 13:30Z), then, before any seed, re-dated with
# the other three to one fresh opening, the re-date commit's time plus 45 minutes up to the next half hour (the owner,
# 2026-11-19: "no countdown realy needed"), each window and final length kept; both times by hand, moving only the
# bundle's own dates (scripts/redate-bundle.ts would also move the transcript gate lines' times of day and the house
# posts' own times). Seeded open, the fund-at-open job records its $500 escrow awaiting the owner's Approve on /admin
# (escrow-approval.mdc): no lock without it, entries held up to an hour past the opening. From then no byte of this
# directory changes (a fix is a new slug). The review-draft history below stands as written.
#
# A HIDDEN DRAFT FOR THE OWNER'S REVIEW (the new-bounty skill's READY), sealed on 2026-11-18/19: competition.yaml,
# status draft and visibility internal, every digest written, its automation keys final and inert while a draft (the
# automation job never sweeps a draft row, the fund-at-open job never funds one), dated at the PROPOSED opening below.
